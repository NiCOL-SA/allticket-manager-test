<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>券管理デモ v6.1</title><style>
:root{--blue:#0645c9;--orange:#e85b00;--red:#d40000;--line:#dfe3ea;--bg:#f4f6f9;--text:#111}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.top{background:var(--blue);color:#fff;padding:14px 18px}.top h1{font-size:22px;margin:0}.top small{display:block;margin-top:5px}.switch{display:flex;gap:8px;padding:12px;overflow:auto;background:#fff;border-bottom:1px solid var(--line)}.switch button,.tabs button,.subtabs button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;white-space:nowrap}.switch .on,.tabs .on,.subtabs .on{background:var(--blue);color:#fff}.screen{display:none}.screen.on{display:block}.wrap{max-width:1200px;margin:auto;padding:14px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.district{font-size:19px;font-weight:800;padding:10px 12px 6px}.pair{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}.stock{background:#fff;border:0;padding:9px 6px 12px;min-height:82px;cursor:pointer}.stock+ .stock{border-left:1px solid var(--line)}.label{font-size:20px;font-weight:800}.night .label{color:var(--blue)}.day .label{color:var(--orange)}.num{font-size:34px;font-weight:850;color:#111;line-height:1.15}.num.zero{color:var(--red)}.unit{font-size:17px;color:#111;margin-left:3px}.actions{display:grid;gap:9px;margin-top:14px}.primary{border:0;border-radius:9px;background:var(--blue);color:#fff;padding:14px;font-weight:800}.secondary{border:1px solid #bcc5d3;border-radius:9px;background:#fff;padding:12px;font-weight:750}.panel{background:#fff;border-radius:14px;padding:16px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:14px}.tabs button{font-size:16px}.subtabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 14px}.subtabs button{border:1px solid var(--line);background:#f7f8fa}.subtabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}.adminview,.addmode{display:none}.adminview.on,.addmode.on{display:block}h2{margin:8px 0 12px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:1020px;background:#fff}th,td{border:1px solid var(--line);padding:9px 7px;text-align:center;font-size:16px}th{background:#f8f9fb}.nightText{color:var(--blue);font-weight:800}.dayText{color:var(--orange);font-weight:800}.zeroText{color:var(--red);font-weight:800}.total{font-weight:850}.grand{margin:12px 0 0 auto;width:max-content;border:2px solid var(--blue);color:var(--blue);border-radius:8px;padding:9px 14px;font-size:20px;font-weight:850}.bulk input{width:46px;text-align:center;padding:7px;border:1px solid #cdd3dc;border-radius:6px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:10}.modal.on{display:flex}.sheet{background:#fff;width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px}.sheet.quickSheet{width:min(480px,calc(100% - 28px));border-radius:18px;margin:auto;align-self:center}.sheethead{display:flex;justify-content:space-between;align-items:center}.x{border:0;background:transparent;font-size:28px}.field{margin:15px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.date{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px}.ticketgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.choice,.qty{border:1px solid #cfd5df;background:#fff;border-radius:7px;padding:10px;font-weight:750}.choice.on,.qty.on{background:var(--blue);color:#fff;border-color:var(--blue)}.choice .n{color:var(--blue)}.choice .d{color:var(--orange)}.choice.on span{color:#fff}.qtygrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.modalactions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.quickQuestion{font-size:21px;font-weight:850;margin:18px 0 8px}.quickDate{color:#555;font-size:15px;margin-top:8px}.quickOne{font-size:17px;margin:6px 0 18px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 15px;border-radius:8px;display:none;z-index:20}.replaceArrow{text-align:center;font-size:24px;font-weight:900;color:#666;margin:4px 0}.hint{font-size:14px;color:#666;margin:6px 0 0}@media(min-width:700px){.cards{grid-template-columns:repeat(3,1fr)}.sheet{border-radius:20px;margin:auto;align-self:center}.modal{align-items:center}.wrap.user{max-width:760px}}
</style></head><body><header class='top'><h1 id='title'>佐藤（会社iPad）</h1><small id='period'>2026年8月17日 08:19 ・ 後半（8/16 09:00〜9/1 08:59）</small></header><nav class='switch'><button class='on' data-screen='ipad'>佐藤・会社iPad</button><button data-screen='phone'>佐藤・個人スマホ</button><button data-screen='facility'>商業施設</button><button data-screen='admin'>事務所管理</button></nav>
<main><section id='ipad' class='screen on'><div class='wrap user'><div class='cards' id='cards-ipad'></div><div class='actions'><button class='primary useBtn'>▣ 券を使用</button><button class='secondary'>▣ 使用履歴を確認</button></div></div></section><section id='phone' class='screen'><div class='wrap user'><div class='cards' id='cards-phone'></div><div class='actions'><button class='primary useBtn'>▣ 券を使用</button><button class='secondary'>▣ 使用履歴を確認</button></div></div></section><section id='facility' class='screen'><div class='wrap user'><div class='cards' id='cards-facility'></div><div class='actions'><button class='primary useBtn'>▣ 券を使用</button><button class='secondary'>▣ 使用履歴を確認</button></div></div></section>
<section id='admin' class='screen'><div class='wrap'><div class='panel'><div class='tabs'><button class='on' data-tab='all'>全員一覧</button><button data-tab='bulk'>一括配券</button><button data-tab='add'>追加・差替</button><button data-tab='devices'>端末</button></div><div id='all' class='adminview on'><h2>全員一覧（現在庫）</h2><div id='alltable'></div></div><div id='bulk' class='adminview'><h2>一括配券（前半／後半）</h2><div id='bulktable'></div><button class='primary' style='width:100%;margin-top:12px' id='bulkCommit'>一括配券を確定</button></div><div id='add' class='adminview'><h2>追加配券・差替</h2><div class='subtabs'><button class='on' data-addmode='addMode'>追加配券</button><button data-addmode='replaceMode'>差替</button></div><div id='addMode' class='addmode on'><div class='field'><label>対象者</label><select class='date' id='addWho'><option value='佐藤'>佐藤</option><option value='商業施設'>商業施設（共有）</option></select></div><div class='field'><label>券種類</label><div class='ticketgrid' id='adminTickets'></div></div><div class='field'><label>枚数（最大5枚）</label><div class='qtygrid' id='adminQty'></div></div><button class='primary' style='width:100%' id='addCommit'>追加配券する</button></div><div id='replaceMode' class='addmode'><div class='field'><label>対象者</label><select class='date' id='replaceWho'><option value='佐藤'>佐藤</option><option value='商業施設'>商業施設（共有）</option></select></div><div class='field'><label>差替元の券種類</label><div class='ticketgrid' id='replaceFrom'></div></div><div class='replaceArrow'>↓</div><div class='field'><label>差替先の券種類</label><div class='ticketgrid' id='replaceTo'></div></div><div class='field'><label>枚数（最大5枚）</label><div class='qtygrid' id='replaceQty'></div><p class='hint'>差替元の在庫を超える枚数は登録できません。</p></div><button class='primary' style='width:100%' id='replaceCommit'>差替を確定する</button></div></div><div id='devices' class='adminview'><h2>端末一覧</h2><div class='tablewrap'><table><tr><th>対象者</th><th>端末名</th><th>種別</th><th>最終利用</th></tr><tr><td>佐藤</td><td>佐藤 会社iPad</td><td>会社iPad</td><td>08/17 08:10</td></tr><tr><td>佐藤</td><td>佐藤 個人スマホ</td><td>個人スマホ</td><td>08/17 08:12</td></tr><tr><td>商業施設（共有）</td><td>商業施設 スマホA</td><td>スマホ</td><td>08/17 08:15</td></tr></table></div></div></div></div></section></main>
<div class='modal' id='modal'><div class='sheet'><div class='sheethead'><div><h2 style='margin:0'>券を使用</h2><small>使用すると現在の期間の在庫から減ります。</small></div><button class='x' id='close'>×</button></div><div class='field'><label>日付</label><input id='date' type='date' class='date' value='2026-08-17'></div><div class='field'><label>券種類（夜／昼を選択してください）</label><div class='ticketgrid' id='ticketChoices'></div></div><div class='field'><label>使用枚数（最大5枚）</label><div class='qtygrid' id='qtyChoices'></div></div><p>現在の在庫： <b id='currentStock'>—</b></p><div class='modalactions'><button class='secondary' id='cancel'>キャンセル</button><button class='primary' id='useCommit'>使用する</button></div></div></div>
<div class='modal' id='quickModal'><div class='sheet quickSheet'><div class='sheethead'><h2 style='margin:0'>クイック使用</h2><button class='x' id='quickClose'>×</button></div><div class='quickDate' id='quickDate'></div><div class='quickQuestion' id='quickQuestion'></div><div class='quickOne'>1枚使用します。</div><div class='modalactions'><button class='secondary' id='quickCancel'>キャンセル</button><button class='primary' id='quickOk'>OK</button></div></div></div><div class='toast' id='toast'></div>
<script>
const districts=['舞洲','西淀','住之江','東淀','平野','八尾'];
const data={佐藤:{'舞洲':[6,8],'西淀':[5,6],'住之江':[4,3],'東淀':[8,7],'平野':[1,2],'八尾':[1,1]},商業施設:{'舞洲':[4,6],'西淀':[6,5],'住之江':[3,4],'東淀':[6,5],'平野':[2,3],'八尾':[2,2]}}; // [夜,昼]
let active='佐藤', selectedTicket=null, selectedQty=1, quickTarget=null;
let adminTicket=null, adminQty=1, replaceFromTicket=null, replaceToTicket=null, replaceQtyValue=1;
function valClass(n){return n===0?'zero':''} function textClass(n){return n===0?'zeroText':''}
function renderCards(id,who){const el=document.getElementById(id);el.innerHTML=districts.map(d=>`<div class='card'><div class='district'>${d}</div><div class='pair'><button class='stock night quick' data-who='${who}' data-d='${d}' data-i='0' aria-label='${d}・夜 ${data[who][d][0]}枚'><div class='label'>夜</div><span class='num ${valClass(data[who][d][0])}'>${data[who][d][0]}</span><span class='unit'>枚</span></button><button class='stock day quick' data-who='${who}' data-d='${d}' data-i='1' aria-label='${d}・昼 ${data[who][d][1]}枚'><div class='label'>昼</div><span class='num ${valClass(data[who][d][1])}'>${data[who][d][1]}</span><span class='unit'>枚</span></button></div></div>`).join('');}
function renderAll(){renderCards('cards-ipad','佐藤');renderCards('cards-phone','佐藤');renderCards('cards-facility','商業施設');renderAdmin();bindQuick()}
function sumWho(w){return districts.reduce((s,d)=>s+data[w][d][0]+data[w][d][1],0)}
function sumSide(w,i){return districts.reduce((s,d)=>s+data[w][d][i],0)}
function renderAdmin(){let colTotals=districts.map(()=>[0,0]);let rows=['佐藤','商業施設'].map(w=>{let cells='';districts.forEach((d,j)=>{colTotals[j][0]+=data[w][d][0];colTotals[j][1]+=data[w][d][1];cells+=`<td class='${textClass(data[w][d][0])}'>${data[w][d][0]}</td><td class='${textClass(data[w][d][1])}'>${data[w][d][1]}</td>`});return `<tr><th>${w==='商業施設'?'商業施設<br>（共有）':w}</th>${cells}<td class='total'>${sumSide(w,0)}</td><td class='total'>${sumSide(w,1)}</td><td class='total'>${sumWho(w)}</td></tr>`}).join('');let grandNight=sumSide('佐藤',0)+sumSide('商業施設',0),grandDay=sumSide('佐藤',1)+sumSide('商業施設',1),grand=grandNight+grandDay;let heads=districts.map(d=>`<th colspan='2'>${d}</th>`).join('');let sub=districts.map(()=>`<th class='nightText'>夜</th><th class='dayText'>昼</th>`).join('');let totals=colTotals.map(x=>`<td>${x[0]}</td><td>${x[1]}</td>`).join('');document.getElementById('alltable').innerHTML=`<div class='tablewrap'><table><tr><th rowspan='2'>対象者</th>${heads}<th rowspan='2'>夜合計</th><th rowspan='2'>昼合計</th><th rowspan='2'>合計</th></tr><tr>${sub}</tr>${rows}<tr><th>合計</th>${totals}<td class='total'>${grandNight}</td><td class='total'>${grandDay}</td><td class='total'>${grand}</td></tr></table></div><div class='grand'>総合計：${grand}</div>`;
let bulkRows=['佐藤','商業施設'].map(w=>`<tr><th>${w==='商業施設'?'商業施設<br>（共有）':w}</th>${districts.map((d,j)=>`<td><input min='0' max='99' inputmode='numeric' value='${j%3}'></td><td><input min='0' max='99' inputmode='numeric' value='${(j+1)%4}'></td>`).join('')}<td class='rowNight'>0</td><td class='rowDay'>0</td><td class='rowBulk'>0</td></tr>`).join('');document.getElementById('bulktable').innerHTML=`<div class='tablewrap bulk'><table id='bulkT'><tr><th rowspan='2'>対象者</th>${heads}<th rowspan='2'>夜合計</th><th rowspan='2'>昼合計</th><th rowspan='2'>合計</th></tr><tr>${sub}</tr>${bulkRows}<tr id='bulkTotals'><th>合計</th>${districts.map(()=>'<td>0</td><td>0</td>').join('')}<td class='total'>0</td><td class='total'>0</td><td class='total'>0</td></tr></table></div><div class='grand' id='bulkGrand'>総合計：0</div>`;calcBulk();bindBulk()}
function ticketButtons(target){document.getElementById(target).innerHTML=districts.flatMap(d=>[0,1].map(i=>`<button class='choice' data-d='${d}' data-i='${i}'>${d}・<span class='${i===0?'n':'d'}'>${i===0?'夜':'昼'}</span></button>`)).join('')}
function qtyButtons(target){document.getElementById(target).innerHTML=Array.from({length:5},(_,i)=>`<button class='qty ${i===0?'on':''}' data-q='${i+1}'>${i+1}</button>`).join('')}
function bindChoiceGroup(target,onSelect,initial=null){document.querySelectorAll(`#${target} .choice`).forEach(b=>{if(initial&&b.dataset.d===initial.d&&Number(b.dataset.i)===initial.i)b.classList.add('on');b.onclick=()=>{document.querySelectorAll(`#${target} .choice`).forEach(x=>x.classList.remove('on'));b.classList.add('on');onSelect({d:b.dataset.d,i:Number(b.dataset.i)})}})}
function bindQtyGroup(target,onSelect){document.querySelectorAll(`#${target} .qty`).forEach(b=>b.onclick=()=>{document.querySelectorAll(`#${target} .qty`).forEach(x=>x.classList.remove('on'));b.classList.add('on');onSelect(Number(b.dataset.q))})}
function openUse(who){active=who;selectedTicket=null;selectedQty=1;ticketButtons('ticketChoices');qtyButtons('qtyChoices');bindChoiceGroup('ticketChoices',t=>{selectedTicket=t;updateStock()});bindQtyGroup('qtyChoices',q=>selectedQty=q);updateStock();document.getElementById('modal').classList.add('on')}
function updateStock(){document.getElementById('currentStock').textContent=selectedTicket?data[active][selectedTicket.d][selectedTicket.i]+'枚':'—'}
function nowJpText(){return new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date())}
function openQuick(who,d,i){let n=data[who][d][i];if(n<=0)return toast('在庫が0枚のため使用できません');quickTarget={who,d,i};document.getElementById('quickDate').textContent='現在日時：'+nowJpText();document.getElementById('quickQuestion').textContent=`「${d}・${i===0?'夜':'昼'}を使用しますか？」`;document.getElementById('quickModal').classList.add('on')}
function bindQuick(){document.querySelectorAll('.quick').forEach(b=>b.onclick=()=>openQuick(b.dataset.who,b.dataset.d,Number(b.dataset.i)))}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function calcBulk(){let table=document.getElementById('bulkT');if(!table)return;let cols=Array(12).fill(0),grand=0,grandNight=0,grandDay=0;[...table.querySelectorAll('tr')].slice(2,4).forEach(r=>{let vals=[...r.querySelectorAll('input')].map(x=>Math.max(0,Number(x.value)||0));let night=vals.filter((_,i)=>i%2===0).reduce((a,b)=>a+b,0),day=vals.filter((_,i)=>i%2===1).reduce((a,b)=>a+b,0),s=night+day;r.querySelector('.rowNight').textContent=night;r.querySelector('.rowDay').textContent=day;r.querySelector('.rowBulk').textContent=s;vals.forEach((v,i)=>cols[i]+=v);grandNight+=night;grandDay+=day;grand+=s});let tds=document.querySelectorAll('#bulkTotals td');cols.forEach((v,i)=>tds[i].textContent=v);tds[12].textContent=grandNight;tds[13].textContent=grandDay;tds[14].textContent=grand;document.getElementById('bulkGrand').textContent='総合計：'+grand}
function bindBulk(){document.querySelectorAll('#bulkT input').forEach(x=>x.oninput=calcBulk)}
function setupAdminSelectors(){ticketButtons('adminTickets');qtyButtons('adminQty');ticketButtons('replaceFrom');ticketButtons('replaceTo');qtyButtons('replaceQty');bindChoiceGroup('adminTickets',t=>adminTicket=t);bindQtyGroup('adminQty',q=>adminQty=q);bindChoiceGroup('replaceFrom',t=>replaceFromTicket=t);bindChoiceGroup('replaceTo',t=>replaceToTicket=t);bindQtyGroup('replaceQty',q=>replaceQtyValue=q)}
document.querySelectorAll('.switch button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.switch button,.screen').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.screen).classList.add('on');let map={ipad:'佐藤（会社iPad）',phone:'佐藤（個人スマホ）',facility:'商業施設（共有）',admin:'券管理クラウド版 デモ（事務所管理画面）'};document.getElementById('title').textContent=map[b.dataset.screen]});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.adminview').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.tab).classList.add('on')});
document.querySelectorAll('.subtabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.subtabs button,.addmode').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.addmode).classList.add('on')});
document.querySelectorAll('.useBtn').forEach((b,i)=>b.onclick=()=>openUse(i===2?'商業施設':'佐藤'));['close','cancel'].forEach(id=>document.getElementById(id).onclick=()=>document.getElementById('modal').classList.remove('on'));
document.getElementById('useCommit').onclick=()=>{if(!selectedTicket)return toast('券種類を選択してください');let n=data[active][selectedTicket.d][selectedTicket.i];if(selectedQty>n)return toast('在庫が足りません');data[active][selectedTicket.d][selectedTicket.i]-=selectedQty;document.getElementById('modal').classList.remove('on');renderAll();toast(selectedTicket.d+'・'+(selectedTicket.i===0?'夜':'昼')+'を'+selectedQty+'枚使用しました')};
['quickClose','quickCancel'].forEach(id=>document.getElementById(id).onclick=()=>document.getElementById('quickModal').classList.remove('on'));
document.getElementById('quickOk').onclick=()=>{if(!quickTarget)return;let {who,d,i}=quickTarget;if(data[who][d][i]<=0){document.getElementById('quickModal').classList.remove('on');return toast('在庫が0枚のため使用できません')}data[who][d][i]-=1;document.getElementById('quickModal').classList.remove('on');renderAll();toast(d+'・'+(i===0?'夜':'昼')+'を1枚使用しました')};
document.getElementById('addCommit').onclick=()=>{if(!adminTicket)return toast('券種類を選択してください');let who=document.getElementById('addWho').value;data[who][adminTicket.d][adminTicket.i]+=adminQty;renderAll();setupAdminSelectors();toast(`${who}へ${adminTicket.d}・${adminTicket.i===0?'夜':'昼'}を${adminQty}枚追加しました`);adminTicket=null;adminQty=1};
document.getElementById('replaceCommit').onclick=()=>{if(!replaceFromTicket||!replaceToTicket)return toast('差替元と差替先を選択してください');if(replaceFromTicket.d===replaceToTicket.d&&replaceFromTicket.i===replaceToTicket.i)return toast('差替元と差替先は別の券を選択してください');let who=document.getElementById('replaceWho').value;let stock=data[who][replaceFromTicket.d][replaceFromTicket.i];if(replaceQtyValue>stock)return toast('差替元の在庫が足りません');data[who][replaceFromTicket.d][replaceFromTicket.i]-=replaceQtyValue;data[who][replaceToTicket.d][replaceToTicket.i]+=replaceQtyValue;renderAll();setupAdminSelectors();toast(`差替を${replaceQtyValue}枚登録しました`);replaceFromTicket=null;replaceToTicket=null;replaceQtyValue=1};
document.getElementById('bulkCommit').onclick=()=>toast('デモ：一括配券を確定しました');renderAll();setupAdminSelectors();
</script></body></html>
