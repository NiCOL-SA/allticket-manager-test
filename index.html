<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>券管理クラウド版 v7.1</title>

<style>
:root{--blue:#0047cc;--orange:#e76600;--red:#d40000;--line:#dfe3ea;--bg:#f4f6f9;--text:#111}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.top{background:var(--blue);color:#fff;padding:14px 18px;position:sticky;top:0;z-index:4}.top h1{font-size:22px;margin:0}.top small{display:block;margin-top:5px}.switch{display:flex;gap:8px;padding:12px;overflow:auto;background:#fff;border-bottom:1px solid var(--line)}.switch button,.tabs button,.subtabs button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;white-space:nowrap}.switch .on,.tabs .on,.subtabs .on{background:var(--blue);color:#fff}.screen{display:none}.screen.on{display:block}.wrap{max-width:1200px;margin:auto;padding:14px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.district{font-size:19px;font-weight:800;padding:10px 12px 6px}.pair{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}.stock{background:#fff;border:0;padding:9px 6px 12px;min-height:82px;cursor:pointer}.stock+.stock{border-left:1px solid var(--line)}.label{font-size:21px;font-weight:850}.night .label,.nightText{color:var(--blue);font-weight:800}.day .label,.dayText{color:var(--orange);font-weight:800}.num{font-size:34px;font-weight:850;color:#111;line-height:1.15}.num.zero,.zeroText{color:var(--red)!important}.unit{font-size:17px;color:#111;margin-left:3px}.actions{display:grid;gap:9px;margin-top:14px}.devicepick{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:0 0 12px}.devicepick button{border:1px solid #cfd5df;background:#fff;border-radius:8px;padding:10px 6px;font-weight:800}.devicepick button.on{background:var(--blue);color:#fff;border-color:var(--blue)}.primary{border:0;border-radius:9px;background:var(--blue);color:#fff;padding:14px;font-weight:800}.secondary{border:1px solid #bcc5d3;border-radius:9px;background:#fff;padding:12px;font-weight:750}.panel{background:#fff;border-radius:14px;padding:16px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:14px}.tabs button{font-size:16px}.subtabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 14px}.subtabs button{border:1px solid var(--line);background:#f7f8fa}.subtabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}.adminview,.addmode{display:none}.adminview.on,.addmode.on{display:block}h2{margin:8px 0 12px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:1020px;background:#fff}th,td{border:1px solid var(--line);padding:9px 7px;text-align:center;font-size:16px}th{background:#f8f9fb}.total{font-weight:850}.grand{margin:12px 0 0 auto;width:max-content;border:2px solid var(--blue);color:var(--blue);border-radius:8px;padding:9px 14px;font-size:20px;font-weight:850}.bulk input{width:46px;text-align:center;padding:7px;border:1px solid #cdd3dc;border-radius:6px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:10}.modal.on{display:flex}.sheet{background:#fff;width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px}.sheet.quickSheet{width:min(480px,calc(100% - 28px));border-radius:18px;margin:auto;align-self:center}.sheethead{display:flex;justify-content:space-between;align-items:center}.x{border:0;background:transparent;font-size:28px}.field{margin:15px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.date{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px}.ticketgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.choice,.qty{border:1px solid #cfd5df;background:#fff;border-radius:7px;padding:10px;font-weight:750}.choice.on,.qty.on{background:var(--blue);color:#fff;border-color:var(--blue)}.choice .n{color:var(--blue)}.choice .d{color:var(--orange)}.choice.on span{color:#fff}.qtygrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.modalactions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.quickQuestion{font-size:21px;font-weight:850;margin:18px 0 8px}.quickDate{color:#555;font-size:15px;margin-top:8px}.quickOne{font-size:17px;margin:6px 0 18px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 15px;border-radius:8px;display:none;z-index:20}.historyList{display:grid;gap:8px}.historyItem{border:1px solid var(--line);border-radius:10px;padding:10px}.historyItem b{display:block;margin-bottom:3px}.hint{font-size:14px;color:#666}.loading{opacity:.55;pointer-events:none}@media(min-width:700px){.cards{grid-template-columns:repeat(2,1fr)}.sheet{border-radius:20px;margin:auto;align-self:center}.modal{align-items:center}.wrap.user{max-width:760px}}
</style></head><body>

</main>
<div class="modal" id="modal"><div class="sheet"><div class="sheethead"><div><h2 style="margin:0">券を使用</h2><small>使用すると現在の期間の在庫から減ります。</small></div><button class="x" id="close">×</button></div><div class="field"><label>日付</label><input id="date" type="date" class="date"></div><div class="field"><label>券種類</label><div class="ticketgrid" id="ticketChoices"></div></div><div class="field"><label>使用枚数（最大5枚）</label><div class="qtygrid" id="qtyChoices"></div></div><p>現在の在庫： <b id="currentStock">—</b></p><div class="modalactions"><button class="secondary" id="cancel">キャンセル</button><button class="primary" id="useCommit">使用する</button></div></div></div>

<div class="modal" id="historyModal"><div class="sheet"><div class="sheethead"><h2 id="historyTitle" style="margin:0">使用履歴</h2><button class="x" id="historyClose">×</button></div><div class="historyList" id="historyList"></div></div></div><div class="toast" id="toast"></div>
<script>
const SUPABASE_URL='https://ylljutljjvwoumajvqor.supabase.co';
const SUPABASE_KEY='sb_publishable_oKPWwKiQozrT3_jIjceFWQ_U89I8l-a';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const districts=['舞洲','西淀','住之江','東淀','平野','八尾'];
const data={佐藤:{},商業施設:{}}; let active='佐藤',activeDevice='佐藤 会社iPad',facilityDevice='商業施設 スマホA',selectedTicket=null,selectedQty=1,quickTarget=null,adminTicket=null,adminQty=1,replaceFromTicket=null,replaceToTicket=null,replaceQtyValue=1;
function emptyData(){['佐藤','商業施設'].forEach(w=>districts.forEach(d=>data[w][d]=[0,0]))} emptyData();
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function jpNow(){return new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date())}
function dateValue(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function periodText(){const j=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Tokyo'}));const shifted=new Date(j.getTime()-9*3600000);const y=shifted.getFullYear(),m=shifted.getMonth()+1,d=shifted.getDate();if(d<16)return `${y}年${m}月前半（${m}/1 09:00〜${m}/16 08:59）`;let nm=m===12?1:m+1;return `${y}年${m}月後半（${m}/16 09:00〜${nm}/1 08:59）`}
async function loadWho(w){const {data:rows,error}=await sb.rpc('app_get_inventory',{p_display_name:w});if(error)throw error;districts.forEach(d=>data[w][d]=[0,0]);rows.forEach(r=>data[w][r.area][r.time_type==='night'?0:1]=Number(r.quantity));}
async function refresh(){document.body.classList.add('loading');try{await Promise.all([loadWho('佐藤'),loadWho('商業施設')]);renderAll();document.getElementById('period').textContent=`${jpNow()} ・ ${periodText()}`;}catch(e){console.error(e);toast('クラウド読込エラー: '+e.message)}finally{document.body.classList.remove('loading')}}
function valClass(n){return n===0?'zero':''} function textClass(n){return n===0?'zeroText':''}
function renderCards(id,who){document.getElementById(id).innerHTML=districts.map(d=>`<div class="card"><div class="district">${d}</div><div class="pair"><button class="stock night quick" data-who="${who}" data-d="${d}" data-i="0"><div class="label">夜</div><span class="num ${valClass(data[who][d][0])}">${data[who][d][0]}</span><span class="unit">枚</span></button><button class="stock day quick" data-who="${who}" data-d="${d}" data-i="1"><div class="label">昼</div><span class="num ${valClass(data[who][d][1])}">${data[who][d][1]}</span><span class="unit">枚</span></button></div></div>`).join('')}
function sumSide(w,i){return districts.reduce((s,d)=>s+data[w][d][i],0)} function sumWho(w){return sumSide(w,0)+sumSide(w,1)}
function renderAdmin(){let col=districts.map(()=>[0,0]);let rows=['佐藤','商業施設'].map(w=>{let cells='';districts.forEach((d,j)=>{col[j][0]+=data[w][d][0];col[j][1]+=data[w][d][1];cells+=`<td class="${textClass(data[w][d][0])}">${data[w][d][0]}</td><td class="${textClass(data[w][d][1])}">${data[w][d][1]}</td>`});return `<tr><th>${w==='商業施設'?'商業施設<br>（共有）':w}</th>${cells}<td class="total">${sumSide(w,0)}</td><td class="total">${sumSide(w,1)}</td><td class="total">${sumWho(w)}</td></tr>`}).join('');const gn=sumSide('佐藤',0)+sumSide('商業施設',0),gd=sumSide('佐藤',1)+sumSide('商業施設',1),g=gn+gd;const heads=districts.map(d=>`<th colspan="2">${d}</th>`).join(''),sub=districts.map(()=>'<th class="nightText">夜</th><th class="dayText">昼</th>').join(''),totals=col.map(x=>`<td>${x[0]}</td><td>${x[1]}</td>`).join('');document.getElementById('alltable').innerHTML=`<div class="tablewrap"><table><tr><th rowspan="2">対象者</th>${heads}<th rowspan="2">夜合計</th><th rowspan="2">昼合計</th><th rowspan="2">合計</th></tr><tr>${sub}</tr>${rows}<tr><th>合計</th>${totals}<td class="total">${gn}</td><td class="total">${gd}</td><td class="total">${g}</td></tr></table></div><div class="grand">総合計：${g}</div>`;renderBulk()}
function renderBulk(){const heads=districts.map(d=>`<th colspan="2">${d}</th>`).join(''),sub=districts.map(()=>'<th class="nightText">夜</th><th class="dayText">昼</th>').join('');let rows=['佐藤','商業施設'].map(w=>`<tr data-w="${w}"><th>${w==='商業施設'?'商業施設<br>（共有）':w}</th>${districts.map(d=>`<td><input type="number" min="0" max="99" value="0" data-d="${d}" data-i="0"></td><td><input type="number" min="0" max="99" value="0" data-d="${d}" data-i="1"></td>`).join('')}<td class="rowNight">0</td><td class="rowDay">0</td><td class="rowBulk">0</td></tr>`).join('');document.getElementById('bulktable').innerHTML=`<div class="tablewrap bulk"><table id="bulkT"><tr><th rowspan="2">対象者</th>${heads}<th rowspan="2">夜合計</th><th rowspan="2">昼合計</th><th rowspan="2">合計</th></tr><tr>${sub}</tr>${rows}<tr id="bulkTotals"><th>合計</th>${districts.map(()=>'<td>0</td><td>0</td>').join('')}<td>0</td><td>0</td><td>0</td></tr></table></div><div class="grand" id="bulkGrand">総合計：0</div>`;document.querySelectorAll('#bulkT input').forEach(x=>x.oninput=calcBulk);calcBulk()}
function calcBulk(){let table=document.getElementById('bulkT');if(!table)return;let cols=Array(12).fill(0),gn=0,gd=0,g=0;[...table.querySelectorAll('tr[data-w]')].forEach(r=>{let vals=[...r.querySelectorAll('input')].map(x=>Math.max(0,Math.min(99,Number(x.value)||0)));let n=vals.filter((_,i)=>i%2===0).reduce((a,b)=>a+b,0),d=vals.filter((_,i)=>i%2===1).reduce((a,b)=>a+b,0);r.querySelector('.rowNight').textContent=n;r.querySelector('.rowDay').textContent=d;r.querySelector('.rowBulk').textContent=n+d;vals.forEach((v,i)=>cols[i]+=v);gn+=n;gd+=d;g+=n+d});let tds=document.querySelectorAll('#bulkTotals td');cols.forEach((v,i)=>tds[i].textContent=v);tds[12].textContent=gn;tds[13].textContent=gd;tds[14].textContent=g;document.getElementById('bulkGrand').textContent='総合計：'+g}
function renderAll(){renderCards('cards-ipad','佐藤');renderCards('cards-phone','佐藤');renderCards('cards-facility','商業施設');renderAdmin();bindQuick()}
function ticketButtons(target){document.getElementById(target).innerHTML=districts.flatMap(d=>[0,1].map(i=>`<button class="choice" data-d="${d}" data-i="${i}">${d}・<span class="${i===0?'n':'d'}">${i===0?'夜':'昼'}</span></button>`)).join('')}
function qtyButtons(target){document.getElementById(target).innerHTML=[1,2,3,4,5].map(q=>`<button class="qty ${q===1?'on':''}" data-q="${q}">${q}</button>`).join('')}
function bindChoices(target,cb){document.querySelectorAll(`#${target} .choice`).forEach(b=>b.onclick=()=>{document.querySelectorAll(`#${target} .choice`).forEach(x=>x.classList.remove('on'));b.classList.add('on');cb({d:b.dataset.d,i:Number(b.dataset.i)})})}function bindQty(target,cb){document.querySelectorAll(`#${target} .qty`).forEach(b=>b.onclick=()=>{document.querySelectorAll(`#${target} .qty`).forEach(x=>x.classList.remove('on'));b.classList.add('on');cb(Number(b.dataset.q))})}
function openUse(who,device){active=who;activeDevice=device;selectedTicket=null;selectedQty=1;ticketButtons('ticketChoices');qtyButtons('qtyChoices');bindChoices('ticketChoices',t=>{selectedTicket=t;updateStock()});bindQty('qtyChoices',q=>selectedQty=q);document.getElementById('date').value=dateValue();updateStock();document.getElementById('modal').classList.add('on')}function updateStock(){document.getElementById('currentStock').textContent=selectedTicket?data[active][selectedTicket.d][selectedTicket.i]+'枚':'—'}
function screenDevice(who){const s=document.querySelector('.screen.on')?.id;if(who==='商業施設')return facilityDevice;return s==='phone'?'佐藤 個人スマホ':'佐藤 会社iPad'}
function openQuick(who,d,i){if(data[who][d][i]<=0)return toast('在庫が0枚のため使用できません');quickTarget={who,d,i,device:screenDevice(who)};document.getElementById('quickDate').textContent='現在日時：'+jpNow();document.getElementById('quickQuestion').textContent=`「${d}・${i===0?'夜':'昼'}を使用しますか？」`;document.getElementById('quickModal').classList.add('on')}function bindQuick(){document.querySelectorAll('.quick').forEach(b=>b.onclick=()=>openQuick(b.dataset.who,b.dataset.d,Number(b.dataset.i)))}
async function useRpc(who,t,q,device){const {data:r,error}=await sb.rpc('app_use_ticket',{p_display_name:who,p_area:t.d,p_time_type:t.i===0?'night':'day',p_quantity:q,p_device_name:device});if(error)throw error;const row=r?.[0];if(!row?.success)throw new Error(row?.message||'使用できませんでした');return row}
async function showHistory(who){document.getElementById('historyTitle').textContent=who+'・使用履歴';document.getElementById('historyList').innerHTML='読み込み中...';document.getElementById('historyModal').classList.add('on');const {data:r,error}=await sb.rpc('app_get_usage_history',{p_display_name:who,p_limit:100});if(error){document.getElementById('historyList').textContent=error.message;return}document.getElementById('historyList').innerHTML=r.length?r.map(x=>`<div class="historyItem"><b>${new Date(x.occurred_at).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'})}</b>${x.area}・${x.time_type==='night'?'夜':'昼'}　${x.used_quantity}枚使用<br><span class="hint">操作端末：${x.device_name}</span></div>`).join(''):'使用履歴はありません。'}
async function loadDevices(){const {data:r,error}=await sb.rpc('app_get_devices');if(error)return document.getElementById('deviceTable').textContent=error.message;document.getElementById('deviceTable').innerHTML=`<div class="tablewrap"><table><tr><th>対象者</th><th>端末名</th><th>種別</th><th>最終利用</th></tr>${r.map(x=>`<tr><td>${x.display_name}</td><td>${x.device_name}</td><td>${x.device_type}</td><td>${x.last_used_at?new Date(x.last_used_at).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}):'未使用'}</td></tr>`).join('')}</table></div>`}
function setupAdminSelectors(){ticketButtons('adminTickets');qtyButtons('adminQty');ticketButtons('replaceFrom');ticketButtons('replaceTo');qtyButtons('replaceQty');bindChoices('adminTickets',t=>adminTicket=t);bindQty('adminQty',q=>adminQty=q);bindChoices('replaceFrom',t=>replaceFromTicket=t);bindChoices('replaceTo',t=>replaceToTicket=t);bindQty('replaceQty',q=>replaceQtyValue=q)}
document.querySelectorAll('.switch button').forEach(b=>b.onclick=async()=>{document.querySelectorAll('.switch button,.screen').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.screen).classList.add('on');const map={ipad:'佐藤（会社iPad）',phone:'佐藤（個人スマホ）',admin:'券管理クラウド版（事務所管理画面）'};document.getElementById('title').textContent=b.dataset.screen==='facility'?'商業施設（'+facilityDevice.replace('商業施設 ','')+'）':map[b.dataset.screen];if(b.dataset.screen==='admin')await loadDevices();await refresh()});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=async()=>{document.querySelectorAll('.tabs button,.adminview').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.tab).classList.add('on');if(b.dataset.tab==='devices')await loadDevices();await refresh()});document.querySelectorAll('.subtabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.subtabs button,.addmode').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.addmode).classList.add('on')});
document.querySelectorAll('.useBtn').forEach(b=>b.onclick=()=>openUse(b.dataset.who,screenDevice(b.dataset.who)));document.querySelectorAll('.refreshBtn').forEach(b=>b.onclick=()=>refresh());document.querySelectorAll('#facilityDevices button').forEach(b=>b.onclick=async()=>{document.querySelectorAll('#facilityDevices button').forEach(x=>x.classList.remove('on'));b.classList.add('on');facilityDevice=b.dataset.device;document.getElementById('title').textContent='商業施設（'+b.textContent+'）';await refresh()});document.querySelectorAll('.historyBtn').forEach(b=>b.onclick=()=>showHistory(b.dataset.who));['close','cancel'].forEach(id=>document.getElementById(id).onclick=()=>document.getElementById('modal').classList.remove('on'));['quickClose','quickCancel'].forEach(id=>document.getElementById(id).onclick=()=>document.getElementById('quickModal').classList.remove('on'));document.getElementById('historyClose').onclick=()=>document.getElementById('historyModal').classList.remove('on');
document.getElementById('useCommit').onclick=async()=>{if(!selectedTicket)return toast('券種類を選択してください');try{await useRpc(active,selectedTicket,selectedQty,activeDevice);document.getElementById('modal').classList.remove('on');await refresh();toast('使用を記録しました')}catch(e){toast(e.message)}};
document.getElementById('quickOk').onclick=async()=>{if(!quickTarget)return;try{await useRpc(quickTarget.who,{d:quickTarget.d,i:quickTarget.i},1,quickTarget.device);document.getElementById('quickModal').classList.remove('on');await refresh();toast('1枚使用しました')}catch(e){toast(e.message)}};
document.getElementById('addCommit').onclick=async()=>{if(!adminTicket)return toast('券種類を選択してください');try{await sb.rpc('app_add_ticket',{p_display_name:document.getElementById('addWho').value,p_area:adminTicket.d,p_time_type:adminTicket.i===0?'night':'day',p_quantity:adminQty,p_memo:'Web管理画面から追加配券'}).then(({error})=>{if(error)throw error});await refresh();toast('追加配券しました')}catch(e){toast(e.message)}};
document.getElementById('replaceCommit').onclick=async()=>{if(!replaceFromTicket||!replaceToTicket)return toast('差替元と差替先を選択してください');try{await sb.rpc('app_swap_ticket',{p_display_name:document.getElementById('replaceWho').value,p_from_area:replaceFromTicket.d,p_from_time_type:replaceFromTicket.i===0?'night':'day',p_to_area:replaceToTicket.d,p_to_time_type:replaceToTicket.i===0?'night':'day',p_quantity:replaceQtyValue}).then(({error})=>{if(error)throw error});await refresh();toast('差替を登録しました')}catch(e){toast(e.message)}};
document.getElementById('bulkCommit').onclick=async()=>{const jobs=[];document.querySelectorAll('#bulkT tr[data-w]').forEach(r=>{const who=r.dataset.w;[...r.querySelectorAll('input')].forEach(x=>{const q=Number(x.value)||0;if(q>0)jobs.push(sb.rpc('app_allocate_ticket',{p_display_name:who,p_area:x.dataset.d,p_time_type:Number(x.dataset.i)===0?'night':'day',p_quantity:q}))})});if(!jobs.length)return toast('配券枚数を入力してください');document.body.classList.add('loading');try{const rs=await Promise.all(jobs);const bad=rs.find(x=>x.error);if(bad)throw bad.error;await refresh();toast('一括配券を登録しました')}catch(e){toast(e.message)}finally{document.body.classList.remove('loading')}};
setupAdminSelectors();refresh();
</script></body></html>
