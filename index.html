<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f5f7">
<title>券管理クラウド版 v4.1 デモ</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#e5e5ea;--blue:#007aff;--red:#ff3b30}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);padding-bottom:40px}
header{padding:16px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);position:sticky;top:0;z-index:10;border-bottom:1px solid #ddd}
main{max-width:1050px;margin:auto;padding:14px}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 16px rgba(0,0,0,.05)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{border:0;border-radius:12px;padding:12px 14px;background:var(--blue);color:#fff;font-weight:700;font-size:16px}
button.secondary{background:#eef1f5;color:#222}
button:disabled{opacity:.38}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.loc{border:1px solid var(--line);border-radius:14px;padding:13px}
.locname{font-weight:800;margin-bottom:10px;font-size:18px}
.daynight{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ticket{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;text-align:left;width:100%;color:var(--text);font-weight:400}
.ticket:active{transform:scale(.985);background:#f1f6ff}
.label{font-size:17px;color:var(--muted);font-weight:700}
.count{font-size:32px;font-weight:800;margin-top:4px}
.zero{color:var(--red)}
.small{font-size:14px;color:var(--muted)}
.notice{background:#fff8e8;border-radius:12px;padding:11px;font-size:14px;color:#745100;margin-bottom:12px;line-height:1.5}
.tablewrap{overflow:auto}
table{border-collapse:collapse;width:100%;min-width:980px}
th,td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:center;font-size:16px}
th{font-size:15px}
th:first-child,td:first-child{text-align:left;font-weight:700;position:sticky;left:0;background:#fff;font-size:17px}
#distributionTable input{font-size:16px;padding:8px 4px}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}
.tabs button{background:#eef1f5;color:#222;white-space:nowrap;font-size:16px}
.tabs button.active{background:var(--blue);color:#fff}
#adjust{font-size:16px}

/* 確認ダイアログ */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.38);display:flex;align-items:center;justify-content:center;padding:18px;z-index:100}
.dialog{width:min(460px,100%);background:#fff;border-radius:18px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.2);max-height:90vh;overflow:auto}
.dialog h2{margin:4px 0 8px;font-size:22px}
.dialog-date{font-size:14px;color:var(--muted);margin-bottom:8px}
.dialog-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}

/* 「券を使用」選択UI */
.choice-title{font-size:15px;font-weight:800;margin:16px 0 8px}
.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choice-grid.two{grid-template-columns:repeat(2,1fr)}
.choice-grid.qty{grid-template-columns:repeat(5,1fr)}
.choice{background:#eef1f5;color:#222;font-size:16px;padding:11px 7px}
.choice.active{background:var(--blue);color:#fff}
.use-summary{margin-top:16px;padding:12px;border-radius:12px;background:#f6f7f9;font-size:16px;line-height:1.6}
.use-summary b{font-size:18px}

@media(min-width:720px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:980px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
  <b style="font-size:22px">券管理クラウド版 v4.1 デモ</b>
  <div class="small" id="headerSub"></div>
</header>

<main>
<section id="gate" class="card">
  <div class="notice">
    画面確認用デモです。社員メールログインなし想定。券の「昼/夜」表示を直接タップすると1枚使用の確認画面が出ます。
  </div>
  <b>デモ表示</b>
  <div class="actions">
    <button onclick="start('admin')">事務所 管理者</button>
    <button class="secondary" onclick="start('sato-ipad')">佐藤・会社iPad</button>
    <button class="secondary" onclick="start('sato-phone')">佐藤・個人スマホ</button>
    <button class="secondary" onclick="start('mall-a')">商業施設・スマホA</button>
    <button class="secondary" onclick="start('mall-b')">商業施設・スマホB</button>
  </div>
</section>

<section id="app" class="hidden">
  <div class="card">
    <div class="small">この端末</div>
    <div id="who" style="font-size:22px;font-weight:800"></div>
    <div id="device" class="small"></div>
    <div class="small" id="periodText" style="margin-top:8px"></div>
  </div>

  <section id="employee" class="hidden">
    <div class="card">
      <div class="small">現在の券</div>
      <div id="inventory" class="grid"></div>
      <div class="actions">
        <button type="button" id="openUseButton">券を使用</button>
      </div>
    </div>
    <div class="card">
      <b style="font-size:18px">使用履歴</b>
      <div id="history"></div>
    </div>
  </section>

  <section id="admin" class="hidden">
    <div class="card">
      <div class="tabs">
        <button id="t-overview" class="active" onclick="showTab('overview')">全員一覧</button>
        <button id="t-distribute" onclick="showTab('distribute')">一括配券</button>
        <button id="t-adjust" onclick="showTab('adjust')">追加・差替</button>
        <button id="t-devices" onclick="showTab('devices')">端末</button>
      </div>

      <div id="overview">
        <div class="tablewrap"><table id="overviewTable"></table></div>
      </div>

      <div id="distribute" class="hidden">
        <div class="notice">各地区の「昼・夜」を横並びで入力します。</div>
        <div class="tablewrap"><table id="distributionTable"></table></div>
        <div class="actions"><button onclick="commitDistribution()">一括配券を確定</button></div>
      </div>

      <div id="adjust" class="hidden">
        <div class="notice">本番では対象・券種・昼夜・枚数を選んで追加配券/差し替えを登録します。</div>
      </div>

      <div id="devices" class="hidden">
        <div id="deviceList"></div>
      </div>
    </div>
  </section>
</section>
</main>

<div id="confirmModal" class="modal hidden" onclick="modalBackdrop(event)">
  <div class="dialog">
    <div id="confirmDate" class="dialog-date"></div>
    <h2 id="confirmTitle"></h2>
    <div class="small">1枚使用します。</div>
    <div class="dialog-actions">
      <button class="secondary" onclick="closeConfirm()">キャンセル</button>
      <button onclick="confirmQuickUse()">OK</button>
    </div>
  </div>
</div>

<div id="useModal" class="modal hidden" onclick="useModalBackdrop(event)">
  <div class="dialog">
    <div class="dialog-date" id="useDate"></div>
    <h2>券を使用</h2>
    <div class="small">地区・昼夜・枚数をタップして選択してください。</div>

    <div class="choice-title">地区</div>
    <div class="choice-grid" id="locationChoices"></div>

    <div class="choice-title">昼・夜</div>
    <div class="choice-grid two" id="dayNightChoices"></div>

    <div class="choice-title">使用枚数</div>
    <div class="choice-grid qty" id="qtyChoices"></div>

    <div class="use-summary" id="useSummary"></div>
    <div class="dialog-actions">
      <button type="button" class="secondary" id="closeUseButton">キャンセル</button>
      <button type="button" id="useSubmit">使用する</button>
    </div>
  </div>
</div>

<script src="./app.js?v=4.1"></script>
</body>
</html>
